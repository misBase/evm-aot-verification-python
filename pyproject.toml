[tool.poetry]
name = "evm-aot-verification"
version = "0.1.0"
description = "Program-level translation verification for EVM AOT compilation to x86-64 machine code using Z3 SMT solver"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
license = "MIT"
packages = [
    { include = "common" },
    { include = "evm_ir" },
    { include = "state" },
    { include = "utils" },
    { include = "verification" },
    { include = "x86_64" },
]

[tool.poetry.dependencies]
python = "^3.8"
z3-solver = ">=4.12.0"
capstone = ">=5.0.0"
graphviz = ">=0.20.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "-s",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]

